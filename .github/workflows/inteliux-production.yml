name: INTELIUX OS Production

on:
  push:
    branches: [inteliux-os]
  pull_request:
    branches: [inteliux-os]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  RUNTIME_SA: ${{ vars.INTELIUX_RUNTIME_SERVICE_ACCOUNT }}
  STORAGE_BUCKET: ${{ vars.INTELIUX_STORAGE_BUCKET }}
  KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL || 'https://api.moonshot.ai/v1' }}
  KIMI_MODEL: ${{ vars.KIMI_MODEL || 'kimi-for-coding' }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        working-directory: apps/inteliux-android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Build debug APK
        working-directory: apps/inteliux-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INTELIUX-OS-debug-apk
          path: apps/inteliux-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  gateway:
    name: Gateway build and container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/inteliux-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/inteliux-gateway/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck/build
        run: npm run build
      - name: Build container
        run: docker build -t inteliux-gateway:test .

  deploy:
    name: Deploy gateway to Cloud Run
    needs: [android, gateway]
    if: ${{ github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' && vars.INTELIUX_RUNTIME_SERVICE_ACCOUNT != '' && vars.INTELIUX_STORAGE_BUCKET != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure Docker
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Ensure Artifact Registry
        run: gcloud artifacts repositories describe inteliux --location="$REGION" --project="$PROJECT_ID" >/dev/null 2>&1 || gcloud artifacts repositories create inteliux --repository-format=docker --location="$REGION" --project="$PROJECT_ID"
      - name: Build and push image
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/inteliux/inteliux-gateway:${{ github.sha }}
        working-directory: backend/inteliux-gateway
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Deploy Cloud Run
        env:
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/inteliux/inteliux-gateway:${{ github.sha }}
        run: |
          gcloud run deploy inteliux-gateway \
            --image="$IMAGE" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --platform=managed \
            --no-allow-unauthenticated \
            --service-account="$RUNTIME_SA" \
            --set-env-vars="KIMI_BASE_URL=$KIMI_BASE_URL,KIMI_MODEL=$KIMI_MODEL,INTELIUX_STORAGE_BUCKET=$STORAGE_BUCKET" \
            --set-secrets="KIMI_API_KEY=inteliux-kimi-api-key:latest" \
            --memory=2Gi --cpu=2 --timeout=3600 --min-instances=0 --max-instances=10
      - name: Print service URL
        run: gcloud run services describe inteliux-gateway --project="$PROJECT_ID" --region="$REGION" --format='value(status.url)'
