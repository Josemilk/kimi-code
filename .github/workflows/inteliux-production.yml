name: INTELIUX OS Production Validation

on:
  push:
    branches: [inteliux-os]
  pull_request:
    branches: [inteliux-os]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate Gradle wrapper
        working-directory: apps/inteliux-android
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Build debug APK
        working-directory: apps/inteliux-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inteliux-os-debug-apk
          path: apps/inteliux-android/app/build/outputs/apk/debug/*.apk

  gateway:
    name: Gateway TypeScript and container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/inteliux-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Typecheck/build
        run: npm run build
      - name: Build container
        run: docker build -t inteliux-gateway:test .
