name: INTELIUX OS Android

on:
  push:
    branches: [ inteliux-os ]
  pull_request:
    branches: [ inteliux-os ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    defaults:
      run:
        working-directory: apps/inteliux-android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate a real Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: inteliux-os-debug-apk
          path: apps/inteliux-android/app/build/outputs/apk/debug/*.apk
