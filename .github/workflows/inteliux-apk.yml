name: INTELIUX OS APK

on:
  workflow_dispatch:
  push:
    branches: [ inteliux-os ]

permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.9'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Generate Gradle Wrapper
        working-directory: apps/inteliux-android
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }} --distribution-type bin

      - name: Verify Gradle
        working-directory: apps/inteliux-android
        run: ./gradlew --version

      - name: Build Debug APK
        working-directory: apps/inteliux-android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        working-directory: apps/inteliux-android
        run: |
          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: INTELIUX-OS-debug-apk
          path: apps/inteliux-android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          echo "## INTELIUX OS APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Build completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "The APK is available under the workflow's Artifacts section as INTELIUX-OS-debug-apk." >> "$GITHUB_STEP_SUMMARY"
